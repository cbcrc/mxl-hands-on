name: test-tools

volumes:
  mxl-domain:
    external: true
    name: gst-apps_mxl-domain

services:
  abi-tester:
    platform: linux/amd64
    build:
      context: ..
      dockerfile: test-tools/ABI-tester/Dockerfile
    image: abi-tester:latest
    container_name: abi-tester
    hostname: abi-tester
    domainname: local
    ports:
      - "9607:9600"   # the C++ backend serves both the API and the React frontend
    volumes:
      - type: volume
        source: mxl-domain
        target: /mxl-domain
      # Scenarios saved from the UI land in the working tree, and new ones are
      # picked up without a rebuild.
      - type: bind
        source: ./ABI-tester/scenarios
        target: /app/scenarios
      # Event-log NDJSON, only when ABI_TESTER_LOG_FILE is set below. Nothing is
      # written unless it is -- the default is an in-memory tail and nothing on disk.
      - type: bind
        source: ./ABI-tester/logs
        target: /app/logs
    environment:
      - MXL_DOMAIN_ROOT=/mxl-domain
      - SCENARIO_DIR=/app/scenarios
      # Uncomment to mirror every event to ./logs/. Appends; a second run of the same
      # process writes events.2.ndjson, so `read_json_auto('*.ndjson')` still finds
      # every run. A load sweep makes this large -- the cap is in bytes.
      # - ABI_TESTER_LOG_FILE=/app/logs/events.ndjson
      # - ABI_TESTER_LOG_MAX_BYTES=2000000000