apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: file-player-clips
  namespace: gst-apps
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: file-player
  namespace: gst-apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: file-player
  template:
    metadata:
      labels:
        app: file-player
    spec:
      nodeSelector:
        kubernetes.io/hostname: ${MXL_NODE}
      initContainers:
        - name: seed-domain
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              set -e
              cp /seed/domain_def.json /mxl-domain/domain_def.json
              chmod a+rwX /mxl-domain
              chmod a+rw /mxl-domain/domain_def.json
          volumeMounts:
            - name: mxl-domain
              mountPath: /mxl-domain
            - name: seed
              mountPath: /seed
      containers:
        - name: app
          image: ghcr.io/cbcrc/file-player:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 9600
          env:
            - name: MXL_DOMAIN
              value: /mxl-domain
          volumeMounts:
            - name: mxl-domain
              mountPath: /mxl-domain
            - name: clips
              mountPath: /home/file
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: mxl-domain
          persistentVolumeClaim:
            claimName: mxl-domain
        - name: seed
          configMap:
            name: mxl-domain-def
        - name: clips
          persistentVolumeClaim:
            claimName: file-player-clips
---
apiVersion: v1
kind: Service
metadata:
  name: file-player
  namespace: gst-apps
  annotations:
    metallb.universe.tf/allow-shared-ip: gst-apps
    metallb.universe.tf/loadBalancerIPs: ${MXL_LB_IP_APPS}
spec:
  type: LoadBalancer
  externalTrafficPolicy: Cluster
  selector:
    app: file-player
  ports:
    - name: http
      port: 9602
      targetPort: 9600
      protocol: TCP